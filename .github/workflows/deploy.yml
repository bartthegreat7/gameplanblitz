name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
  # Refresh the News & Articles hub: re-fetch publisher feeds every 2 hours and redeploy.
  # (GitHub pauses scheduled workflows after 60 days without repository activity.)
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the TypeScript aggregator directly (type stripping), no extra tooling
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Aggregate news feeds (server-side; never blocks the deploy)
        run: node scripts/news/aggregate.ts --out public/news.json
        continue-on-error: true
        env:
          NEWS_MAX_AGE_DAYS: 14
          NEWS_MAX_ITEMS: 400
      - name: Build the projection model (server-side; never blocks the deploy)
        run: node scripts/model/build.ts --out public/model.json
        continue-on-error: true
        env:
          # the published file's metrics become the next version's history
          MODEL_PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/model.json
      - run: npm run build
        env:
          VITE_NEWS_API: ${{ vars.VITE_NEWS_API }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
